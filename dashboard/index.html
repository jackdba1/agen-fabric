<!DOCTYPE html>
<html lang="en" data-webtui-theme="toxic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Fabric</title>
<link rel="stylesheet" href="webtui.css">
<style>
/* ═══════════════════════════════════════════════════════════
   Agent Fabric Dashboard — PartyGraph biopunk terminal
   Exact palette, spacing, and componentry from PartyGraph
   ═══════════════════════════════════════════════════════════ */

@font-face { font-family:'JetBrains Mono'; src:url('fonts/jetbrains-mono-400.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'JetBrains Mono'; src:url('fonts/jetbrains-mono-700.woff2') format('woff2'); font-weight:700; }
@font-face { font-family:'VT323'; src:url('fonts/vt323-400.woff2') format('woff2'); font-weight:400; }

:root, [data-webtui-theme='toxic'] {
  --background0:#04140d; --background1:#0a2417; --background2:#103524; --background3:#1f7a3a;
  --foreground0:#b8f5c9; --foreground1:#5a8f6e; --foreground2:#39ff14;
  --accent:#39ff14; --accent-dim:#1f7a3a; --accent-soft:#0f2a1a; --accent-strong:#7dff5c;
  --cyan:#39e6ff; --magenta:#ff2e88; --warn:#ffb347; --danger:#ff4d4d;
  --font-family:'JetBrains Mono',ui-monospace,monospace; --font-display:'VT323','JetBrains Mono',monospace;
  --font-size:13px; --line-height:1.35;
  --box-border-color:var(--accent-dim); --box-border-width:1px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--background0);color:var(--foreground1);font-family:var(--font-family);font-size:var(--font-size);line-height:var(--line-height)}
body::after{content:'';position:fixed;inset:0;z-index:99;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px)}
body::before{content:'';position:fixed;inset:0;z-index:98;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.32) 100%)}

#app{display:grid;grid-template-areas:'header header''nav view';grid-template-columns:18ch 1fr;grid-template-rows:auto 1fr;height:100vh;padding:.75ch;gap:.75ch}

/* header */
#header{grid-area:header;display:flex;align-items:center;justify-content:space-between;padding:.5lh 1ch;border:1px solid var(--accent-dim)}
#header .brand{font-family:var(--font-display);font-size:1.4em;color:var(--accent);letter-spacing:.05em}
#header .meta{font-size:.85em;color:var(--foreground1);display:flex;gap:1.5ch}

/* nav */
#nav{grid-area:nav;display:flex;flex-direction:column;gap:.5ch;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:.75ch;padding:0 .75ch;font-size:.85em;color:var(--foreground1);cursor:pointer;border-left:2px solid transparent;transition:background-color .12s,color .12s,border-color .12s}
.nav-item:hover{color:var(--foreground0)}
.nav-item.active{color:var(--accent);border-left-color:var(--accent)}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.nav-item .dot.offline{background:var(--foreground1);opacity:.4}
.nav-item .dot.stale{background:var(--warn)}

/* view */
#view{grid-area:view;display:flex;flex-direction:column;gap:.75ch;overflow-y:auto}
.card{border:1px solid var(--accent-dim);background:var(--background1);box-shadow:0 0 6px rgba(0,0,0,.25)}
.card-title{font-family:var(--font-display);font-size:1.1em;color:var(--foreground1);padding:0 1ch;border-bottom:1px solid var(--accent-dim);line-height:2}
.card-body{padding:.5lh 1ch;display:flex;flex-direction:column;gap:.25lh}

/* kv */
.kv{display:grid;grid-template-columns:auto 1fr;row-gap:.1lh;column-gap:1.5ch;font-size:.85em}
.kv .l{color:var(--foreground1)} .kv .v{color:var(--foreground0)}
.kv .v.accent{color:var(--accent)} .kv .v.danger{color:var(--danger)} .kv .v.warn{color:var(--warn)}

/* bars */
.bars{display:flex;align-items:flex-end;gap:1px;height:3lh}
.bar{flex:1;background:var(--accent-dim);min-width:2px;transition:height .15s ease-out}
.bar:hover{background:var(--accent)}

/* caps */
.caps{display:flex;flex-wrap:wrap;gap:2px}
.cap{font-size:.78em;padding:0 .5ch;border:1px solid var(--accent-dim);color:var(--foreground1)}
.cap.accent{color:var(--accent);border-color:var(--accent)}

/* event feed */
.event{font-size:.78em;padding:.1lh 0;border-bottom:1px solid var(--background2);display:flex;gap:1ch}
.event .ts{color:var(--foreground1);opacity:.5;flex-shrink:0}
.event .type{color:var(--accent);flex-shrink:0}
.event .msg{color:var(--foreground1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pulse animation (PartyGraph pg-pulse) */
@keyframes pg-pulse{0%,100%{box-shadow:inset 0 0 0 1px var(--accent)}50%{box-shadow:inset 0 0 0 1px transparent}}
.pulse{animation:pg-pulse 1.2s ease-in-out infinite}

/* fade in */
@keyframes pg-fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:pg-fade-in .28s ease-out}

/* skeleton */
@keyframes pg-skeleton{0%,100%{opacity:.3}50%{opacity:.6}}
.skeleton{animation:pg-skeleton 1.2s ease-in-out infinite;background:var(--background2);border-radius:2px;display:inline-block;min-width:8ch;height:1em}

.text-shadow{text-shadow:0 0 5px var(--accent-soft)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="brand text-shadow"> Agent Fabric</div>
    <div class="meta">
      <span>agents <span id="h-agents" style="color:var(--accent)">0</span></span>
      <span>events <span id="h-events" style="color:var(--foreground0)">0</span></span>
      <span id="h-clock" style="opacity:.5"></span>
    </div>
  </div>

  <div id="nav">
    <div class="nav-item active"><span class="dot"></span> Overview</div>
    <div class="nav-item"><span class="dot offline"></span> Events</div>
    <div class="nav-item"><span class="dot offline"></span> Skills</div>
  </div>

  <div id="view">
    <div class="card" id="agents-card">
      <div class="card-title"> Connected Agents</div>
      <div class="card-body" id="agents-body">
        <span class="skeleton" style="width:30ch"></span>
      </div>
    </div>

    <div class="card">
      <div class="card-title"> Stats</div>
      <div class="card-body">
        <div class="kv" id="stats-kv"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"> Live Events</div>
      <div class="card-body" id="events-body" style="max-height:20lh;overflow-y:auto">
        <span class="skeleton" style="width:40ch"></span>
      </div>
    </div>
  </div>
</div>

<script>
const STATS_URL = `${location.protocol}//${location.hostname}:8411/stats`;
const WS_URL = `ws://${location.hostname}:8400/ws`;
let ws, agents={}, events=[], startTime=Date.now();

function $(s){return document.querySelector(s)}

function connect(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{
    ws.send(JSON.stringify({type:'register',agent_id:'dashboard',agent_type:'monitor',capabilities:['dashboard']}));
    ws.send(JSON.stringify({type:'event:subscribe',agent_id:'dashboard',event_type:'*'}));
    refresh();
  };
  ws.onmessage=(e)=>{
    try{
      const m=JSON.parse(e.data);
      if(m.type==='event'){events.unshift({ts:new Date().toLocaleTimeString(),type:m.event_type,msg:JSON.stringify(m.payload).substring(0,80)});renderEvents()}
    }catch(e){}
  };
  ws.onclose=()=>setTimeout(connect,2000);
}

async function refresh(){
  try{
    const r=await fetch(STATS_URL);const d=await r.json();
    agents=d.agents||{};
    renderAgents();
    renderStats(d);
    $('h-agents').textContent=d.agent_count||0;
    $('h-events').textContent=d.event_count||0;
  }catch(e){}
}

function renderAgents(){
  const ids=Object.keys(agents);
  if(!ids.length){$('agents-body').innerHTML='<span style="color:var(--foreground1);opacity:.5">no agents connected</span>';return}
  let h='';
  for(const[id,a] of Object.entries(agents)){
    const st=a.status||'offline';
    const dotCls=st==='online'?'':' '+st;
    const rowCls=st==='online'?'pulse':'';
    h+=`<div class="kv fade-in">
      <span class="l"><span class="dot${dotCls}" style="display:inline-block;margin-right:.5ch"></span>${id}</span>
      <span class="v">[${a.type||'?'}]</span>
      <span class="l"></span>
      <span class="v caps">${(a.caps||[]).map(c=>`<span class="cap${c==='dashboard'?' accent':''}">${c}</span>`).join('')}</span>
    </div>`;
  }
  $('agents-body').innerHTML=h;
}

function renderStats(d){
  $('stats-kv').innerHTML=`
    <span class="l">agents</span><span class="v accent">${d.agent_count||0}</span>
    <span class="l">events</span><span class="v">${d.event_count||0}</span>
    <span class="l">tasks</span><span class="v">${d.task_count||0}</span>
    <span class="l">uptime</span><span class="v">${Math.floor((d.uptime||0)/60)}m</span>
    <span class="l">gateway</span><span class="v accent">ws://:8400</span>
  `.trim();
}

function renderEvents(){
  const recent=events.slice(0,30);
  $('events-body').innerHTML=recent.map(e=>
    `<div class="event fade-in"><span class="ts">${e.ts}</span><span class="type">${e.type}</span><span class="msg">${e.msg}</span></div>`
  ).join('')||'<span style="color:var(--foreground1);opacity:.5">no events yet</span>';
}

setInterval(()=>{
  const s=Math.floor((Date.now()-startTime)/1000);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  $('h-clock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
},1000);

setInterval(refresh,5000);
connect();
</script>
</body>
</html>
