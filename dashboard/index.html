<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Fabric Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#04140d; --bg1:#0a2417; --bg2:#103524; --bg3:#1f7a3a;
  --fg0:#b8f5c9; --fg1:#5a8f6e; --fg2:#2d4a34;
  --accent:#39ff14; --cyan:#39e6ff; --magenta:#ff2e88;
  --warn:#ffb347; --danger:#ff4d4d;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);color:var(--fg1);font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5}
body::after{content:'';position:fixed;inset:0;z-index:99;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px)}
#app{position:relative;z-index:10;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 300px;height:100%;padding:10px 14px 8px;gap:8px}
#header{grid-column:1/-1;border:1px solid var(--fg2);background:var(--bg1);display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
#header h1{font-family:'VT323',monospace;font-size:22px;color:var(--accent);letter-spacing:2px;text-shadow:0 0 12px var(--accent-soft)}
#agents-panel{grid-column:1;grid-row:2;border:1px solid var(--fg2);background:var(--bg0);overflow-y:auto;padding:12px}
#agents-panel h2{font-family:'VT323',monospace;font-size:16px;color:var(--fg1);margin-bottom:8px;border-bottom:1px solid var(--bg3);padding-bottom:4px}
.agent-card{border:1px solid var(--fg2);background:var(--bg1);padding:8px 10px;margin-bottom:6px}
.agent-card .id{color:var(--fg0);font-weight:700}
.agent-card .type{color:var(--fg2);font-size:10px}
.agent-card .caps{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.agent-card .cap{background:var(--bg2);color:var(--fg2);padding:1px 6px;font-size:9px;border:1px solid var(--bg3)}
.online{color:var(--accent)} .offline{color:var(--fg2)} .stale{color:var(--warn)}
#sidebar{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:6px}
.card{border:1px solid var(--fg2);background:var(--bg1);padding:8px 10px}
.card h3{font-family:'VT323',monospace;font-size:14px;color:var(--fg1);border-bottom:1px solid var(--bg3);padding-bottom:3px;margin-bottom:6px}
#event-feed{max-height:250px;overflow-y:auto;font-size:9.5px}
#event-feed div{padding:1px 0;border-bottom:1px solid var(--bg2)}
#event-feed .ts{color:var(--fg2)}
#cmd-bar{grid-column:1/-1;grid-row:3;border:1px solid var(--fg2);background:var(--bg1);display:flex;align-items:center;gap:10px;padding:6px 14px}
#cmd-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--fg0);font:inherit;caret-color:var(--accent)}
#cmd-bar input::placeholder{color:var(--fg2)}
#cmd-bar button{background:var(--bg3);border:1px solid var(--fg2);color:var(--accent);padding:3px 16px;font:inherit;cursor:pointer;font-family:'VT323',monospace;font-size:14px;letter-spacing:1px}
#cmd-bar button:hover{background:var(--accent-soft);border-color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1> AGENT FABRIC</h1>
    <div id="clock" style="font-size:10px;color:var(--fg2)"></div>
  </div>
  <div id="agents-panel">
    <h2> CONNECTED AGENTS</h2>
    <div id="agent-list">No agents connected.</div>
  </div>
  <div id="sidebar">
    <div class="card">
      <h3> STATS</h3>
      <div id="stats">Loading...</div>
    </div>
    <div class="card">
      <h3> LIVE EVENTS</h3>
      <div id="event-feed"></div>
    </div>
  </div>
  <div id="cmd-bar">
    <input id="fabric-cmd" placeholder="broadcast: hello world" onkeydown="if(event.key==='Enter')broadcast()">
    <button onclick="broadcast()">SEND</button>
  </div>
</div>

<script>
const STATS_URL = `${location.protocol}//${location.hostname}:8411/stats`;
let ws;

function connect() {
  ws = new WebSocket(`ws://${location.hostname}:8400/ws`);
  ws.onopen = () => {
    ws.send(JSON.stringify({type:'register',agent_id:'dashboard',agent_type:'monitor',capabilities:['dashboard']}));
    ws.send(JSON.stringify({type:'event:subscribe',agent_id:'dashboard',event_type:'*'}));
    refresh();
  };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'event') {
        addEvent(msg.event_type, JSON.stringify(msg.payload).substring(0,100));
        refresh();
      }
    } catch(e) {}
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

async function refresh() {
  try {
    const r = await fetch(STATS_URL);
    const d = await r.json();
    renderAgents(d.agents, d.agent_count);
    document.getElementById('stats').innerHTML =
      `Agents: <span style="color:var(--accent)">${d.agent_count}</span><br>` +
      `Events: <span style="color:var(--fg0)">${d.event_count}</span><br>` +
      `Tasks: <span style="color:var(--fg0)">${d.task_count}</span><br>` +
      `Uptime: <span style="color:var(--fg2)">${Math.floor(d.uptime)}s</span>`;
  } catch(e) {}
}

function renderAgents(agents, count) {
  if (!agents || count === 0) {
    document.getElementById('agent-list').innerHTML = '<span style="color:var(--fg2)">No agents connected.</span>';
    return;
  }
  let html = '';
  for (const [id, a] of Object.entries(agents)) {
    const cls = a.status === 'online' ? 'online' : a.status === 'stale' ? 'stale' : 'offline';
    html += `<div class="agent-card">
      <span class="id">${id}</span> <span class="type">[${a.type}]</span>
      <span class="${cls}" style="font-size:10px"> ${a.status}</span>
      <div class="caps">${(a.caps||[]).map(c=>`<span class="cap">${c}</span>`).join('')}</div>
    </div>`;
  }
  document.getElementById('agent-list').innerHTML = html;
}

function addEvent(type, payload) {
  const feed = document.getElementById('event-feed');
  const ts = new Date().toLocaleTimeString();
  feed.innerHTML = `<div><span class="ts">${ts}</span> <span style="color:var(--accent)">${type}</span> ${payload}</div>` + feed.innerHTML;
  if (feed.children.length > 50) feed.lastChild.remove();
}

function broadcast() {
  const inp = document.getElementById('fabric-cmd');
  const text = inp.value.trim();
  if (text && ws) {
    ws.send(JSON.stringify({type:'event:publish',agent_id:'dashboard',event_type:'dashboard.broadcast',payload:{message:text}}));
    inp.value = '';
  }
}

setInterval(refresh, 5000);
setInterval(() => {
  const s = Math.floor((Date.now() - performance.timeOrigin) / 1000);
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  document.getElementById('clock').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
},1000);

connect();
</script>
</body>
</html>
